<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Urban Kicks - Contacto</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f0f12;
      color: #f0f0f5;
    }
    header {
      background-color: #18181c;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #2a2a32;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #00ffcc;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    nav a {
      color: #a0a0b0;
      text-decoration: none;
      margin-left: 1.5rem;
      font-weight: 600;
      transition: color 0.3s;
    }
    nav a:hover, nav a.active {
      color: #00ffcc;
    }
    .container {
      max-width: 600px;
      margin: 3rem auto;
      padding: 2rem;
      background-color: #18181c;
      border-radius: 8px;
      border: 1px solid #2a2a32;
    }
    h1 {
      color: #00ffcc;
      margin-top: 0;
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      color: #a0a0b0;
    }
    input, textarea {
      width: 100%;
      padding: 0.75rem;
      background-color: #0f0f12;
      border: 1px solid #2a2a32;
      border-radius: 4px;
      color: #ffffff;
      box-sizing: border-box;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #00ffcc;
    }
    button {
      background-color: #00ffcc;
      color: #0f0f12;
      border: none;
      padding: 0.75rem 1.5rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      text-transform: uppercase;
    }
    button:hover {
      background-color: #00cca3;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">Urban Kicks</div>
    <nav>
      <a href="index.html">Inicio</a>
      <a href="about.html">Nosotros</a>
      <a href="contact.html" class="active">Contacto</a>
    </nav>
  </header>

  <main class="container">
    <h1>Contáctanos</h1>
    <form action="#" method="post" onsubmit="event.preventDefault(); alert('Mensaje enviado');">
      <div class="form-group">
        <label for="name">Nombre</label>
        <input type="text" id="name" required placeholder="Tu nombre">
      </div>
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" required placeholder="tu@email.com">
      </div>
      <div class="form-group">
        <label for="message">Mensaje</label>
        <textarea id="message" rows="5" required placeholder="¿En qué te podemos ayudar?"></textarea>
      </div>
      <button type="submit">Enviar Mensaje</button>
    </form>
  </main>

</body>
</html>
